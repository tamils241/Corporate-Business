<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stackly | Sign In</title>
<meta name="description" content="Sign in to your Stackly account to access projects, tools and collaboration spaces.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<main class="signup-layout">
  <section class="visual-panel">
    <div class="photo"></div><div class="visual-shade"></div>
    <a class="auth-logo" href="index.html" aria-label="Stackly â€” home">
      <img src="images/logo/logo.webp" alt="Stackly">
    </a>
    <div class="red-corner red-bottom"></div>
    <div class="visual-copy">
      <span class="eyebrow"></span>
      <h1>Welcome Back<br>to Stackly</h1>
      <p>Sign in to pick up where you left off and keep your projects moving forward.</p>
      <div class="benefits">
        <div class="benefit"><svg viewBox="0 0 32 32"><circle cx="11" cy="10" r="5"/><path d="M2 27v-2c0-4 4-7 9-7s9 3 9 7v2M22 6a5 5 0 0 1 0 9m2 4c4 0 6 3 6 6v2"/></svg><span>Resume<br>your work</span></div>
        <div class="benefit"><svg viewBox="0 0 32 32"><path d="m16 3 11 4v8c0 7-5 11-11 14C10 26 5 22 5 15V7l11-4Z"/><path d="m11 16 4 4 7-8"/></svg><span>Access<br>premium tools</span></div>
        <div class="benefit"><svg viewBox="0 0 32 32"><path d="m4 25 8-8 5 4L28 8M20 8h8v8"/></svg><span>Track<br>your progress</span></div>
      </div>
    </div>
    <div class="dot-pattern"></div>
  </section>
  <section class="form-panel">
    <div class="form-wrap">
      <header class="form-heading">
        <h2>Welcome Back</h2>
        <p>Sign in to your Stackly account.</p>
      </header>
      <button class="google-button" type="button" data-message="loginMessage"><span class="google-g">G</span>Sign in with Google</button>
      <div class="separator"><span></span><b>Or</b><span></span></div>
      <form id="loginForm" novalidate>
        <label class="input-wrap">
          <span class="sr-only">Account role</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/></svg>
          <select id="loginRole" name="role" aria-describedby="loginMessage" required>
            <option value="client" selected>Client</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <label class="input-wrap">
          <span class="sr-only">Email address</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          <input id="loginEmail" type="email" placeholder="Enter your Email" autocomplete="email" aria-describedby="loginMessage" required>
        </label>
        <label class="input-wrap">
          <span class="sr-only">Password</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/></svg>
          <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" aria-describedby="loginMessage" required>
          <button class="toggle-password" type="button" data-target="loginPassword" aria-label="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </label>
        <div class="form-row">
          <label class="remember"><input id="rememberMe" type="checkbox"><span>Remember me</span></label>
          <a class="forgot-link" href="#">Forgot password?</a>
        </div>
        <p class="form-message" id="loginMessage" role="status" aria-live="polite"></p>
        <button class="submit-button" type="submit">Sign in</button>
      </form>
      <p class="account-prompt">New to Stackly? <a href="register.html">Create an account</a></p>
    </div>
  </section>
</main>
<script src="js/script.js"></script>
</body></html>
